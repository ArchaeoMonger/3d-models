<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script type="module"
        src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.1.0/model-viewer.min.js">
    </script>

    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: white;
        }

        model-viewer {
            width: 100%;
            height: 100%;
        }
    </style>
</head>

<body>

<model-viewer
    src="untitled.glb"
    camera-controls
    auto-rotate
    shadow-intensity="1"
    alt="Interactive 3D photogrammetric model of an archaeological excavation">
</model-viewer>

</body>
</html>
